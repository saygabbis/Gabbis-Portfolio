<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabbis ✦ arte, motion & código</title>
    <meta name="description" content="Portfolio da Gabbis (SayGabbis): ilustração digital, motion design, edição e projetos de código." />

    <meta property="og:image" content="/media/og.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <script>
      // aplica o tema antes de pintar, pra não piscar
      try {
        const t = localStorage.getItem('theme');
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
